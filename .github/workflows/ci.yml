name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    # converted_to_draft is kept intentionally: it creates "skipped" check entries
    # that satisfy required-check branch-protection rules when a PR is demoted
    # back to draft, preventing stale "pending" statuses from the last real push.
    branches: [main]
    # paths-ignore is intentionally NOT set here — workflow-level path filtering
    # prevents GitHub from creating any check run, which deadlocks required-status
    # checks on docs-only PRs. Path-based skipping is handled by the `changes`
    # preflight job below (dorny/paths-filter produces 'skipped' statuses that
    # GitHub counts as passing for required checks).

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # docs_only=true means ALL changed files are documentation.
      # For push events the paths-filter step is skipped; default to 'false'
      # (not docs_only) so downstream jobs always run on direct main pushes.
      docs_only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.docs_only || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # predicate-quantifier: every means ALL changed files must satisfy the
          # docs_only filter for it to be true. So docs_only=true only when every
          # changed file is a markdown/doc/template file.
          #
          # This is the inverse pattern: instead of listing every code file type
          # (impossible to enumerate completely), we only define what counts as
          # pure documentation. Anything else — .golangci.yml, Dockerfile,
          # turbo.json, package-lock.json, etc. — automatically triggers CI
          # because it won't match docs_only, so docs_only becomes false.
          predicate-quantifier: 'every'
          filters: |
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'


  build:
    needs: [changes]
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
